[package]
name = "epub-mstts-audio"
version = "0.1.0"
description = "EPUB electronic book audio generator (mstts offline neural TTS)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
quick-xml = "0.37"
scraper = "0.22"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
base64 = { version = "0.22", features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
